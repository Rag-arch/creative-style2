<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>私という作風</title>

    <!-- ▼▼▼ OGP・X用カード設定 ▼▼▼ -->
    <meta property="og:title" content="私という作風 - 創作の傾向診断">
    <meta property="og:description" content="全39問の質問と画像選択から、あなたの「創作の傾向（3軸の組み合わせ）」を診断します。">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://rag-arch.github.io/creative-style">
    <meta property="og:image" content="https://rag-arch.github.io/creative-style/ogp-v3.png">
    <meta property="og:site_name" content="私という作風">

    <meta name="twitter:card" content="summary_large_image">
    <!-- ▲▲▲ OGP設定ここまで ▲▲▲ -->

    <!-- html2canvas ライブラリ (画像ダウンロード機能用) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            /* 白基調のカラーパレット */
            --bg-color: #ffffff;
            --card-bg: #ffffff;
            --text-main: #222222;
            --text-sub: #666666;
            --accent-color: #222222;
            --border-color: #e0e0e0;
            --font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI", "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            
            /* ライブグラデーション用の初期変数 */
            --live-grad: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-text-size-adjust: 100%;
        }

        body {
            background-color: var(--bg-color);
            background-image: var(--live-grad);
            background-attachment: fixed;
            color: var(--text-main);
            font-family: var(--font-family);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 12px;
            letter-spacing: 0.05em;
            line-height: 1.5;
            transition: background-image 0.5s ease;
        }

        .container {
            width: 100%;
            max-width: 540px;
            margin: 0 auto;
        }

        .screen {
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .screen.active {
            display: block;
            opacity: 1;
        }

        /* ----- UI / スタート・質問・画像選択画面 ----- */
        h1.main-title {
            font-size: 2.2rem;
            font-weight: 900;
            text-align: center;
            letter-spacing: 0.2em;
            margin-bottom: 1.5rem;
            text-transform: uppercase;
            color: var(--text-main);
        }

        .start-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 100%;
            margin: 0 auto;
        }

        .subtitle {
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-sub);
            margin-bottom: 2.5rem;
            line-height: 1.8;
            width: 100%;
        }

        .btn {
            display: inline-block;
            width: 100%;
            padding: 14px 24px;
            background: #222222;
            color: #ffffff;
            border: 1px solid #222222;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            text-decoration: none;
            border-radius: 0;
        }

        .btn-start {
            width: 100%;
        }

        .btn:hover {
            background: #ffffff;
            color: #222222;
            border-color: #222222;
        }

        .btn:disabled {
            border-color: #cccccc;
            color: #cccccc;
            cursor: not-allowed;
            background: transparent;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 16px;
        }

        .btn-secondary {
            border-color: var(--border-color);
            color: var(--text-main);
            background: #f9f9f9;
        }

        .btn-secondary:hover {
            background: #eeeeee;
            color: #000000;
            border-color: #bbbbbb;
        }

        /* 質問カード共通 */
        .q-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.2rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        .q-number {
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.15em;
            color: var(--text-main);
        }

        .q-title {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            text-align: center;
            line-height: 1.5;
            color: var(--text-main);
        }

        /* 8択グリッド用スタイル */
        .grid-instruction {
            font-size: 0.85rem;
            text-align: center;
            color: var(--text-main);
            margin-bottom: 0.3rem;
            font-weight: 600;
        }

        .grid-sub-instruction {
            font-size: 0.75rem;
            text-align: center;
            color: var(--text-sub);
            margin-bottom: 1rem;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px 8px;
            margin-bottom: 0.5rem;
        }

        .grid-cell {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .grid-item {
            width: 100%;
            aspect-ratio: 1 / 1;
            border: 2px solid var(--border-color);
            cursor: pointer;
            position: relative;
            overflow: hidden;
            background: #f0f0f0;
            border-radius: 0;
            transition: all 0.2s ease;
        }

        .grid-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            pointer-events: none;
            -webkit-user-drag: none;
            user-select: none;
        }

        /* 各画像の下に個別のキャプションをつけるスタイル */
        .item-caption {
            display: none; /* データは残したまま画面非表示に設定[cite: 1] */
            font-size: 0.5rem;
            color: var(--text-sub);
            text-align: center;
            margin-top: 4px;
            line-height: 1.2;
            word-break: break-all;
        }

        .grid-item.selected {
            border-color: #222222;
            box-shadow: 0 0 0 2px #222222;
        }

        .grid-item.selected-1::after {
            content: "1";
            position: absolute;
            top: 4px;
            right: 4px;
            background: #222222;
            color: #ffffff;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: bold;
        }

        .grid-item.selected-2::after {
            content: "2";
            position: absolute;
            top: 4px;
            right: 4px;
            background: #777777;
            color: #ffffff;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: bold;
        }

        /* 画像アップロード画面 */
        .file-upload-wrapper {
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .file-input {
            display: none;
        }

        .file-label {
            border: 1px dashed var(--text-sub);
            padding: 30px 20px;
            display: block;
            cursor: pointer;
            background: #fafafa;
            border-radius: 0;
            transition: background 0.2s, border 0.2s;
            color: var(--text-main);
        }

        .file-label.has-image {
            border: none;
            padding: 5px 0;
            background: transparent;
        }

        .preview-mini {
            max-width: 160px;
            max-height: 160px;
            margin: 10px auto 0;
            display: none;
            object-fit: cover;
            border-radius: 0;
        }

        /* ----- 最終結果カード ----- */
        .result-card-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            margin: 0 auto;
        }

        .result-card {
            background-color: var(--card-bg);
            border-radius: 0;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            padding: 16px 16px;
            margin-bottom: 12px;
            border: 1px solid var(--border-color);
            width: 100%;
            max-width: 100%;
            transition: background 0.5s ease;
            overflow: hidden;
            color: var(--text-main);
        }

        .card-header {
            text-align: center;
            margin-bottom: 8px;
        }

        .app-title {
            font-size: 9px;
            color: var(--text-sub);
            letter-spacing: 0.1em;
            margin: 0 0 1px 0;
        }

        .axes-grid-layout {
            display: grid;
            grid-template-columns: 1fr auto 1fr auto 1fr;
            align-items: baseline;
            justify-items: center;
            max-width: 100%;
            margin: 0 auto 10px auto;
            overflow-x: auto;
        }

        .axis-col-1 { grid-column: 1; }
        .axis-sep-1 { grid-column: 2; }
        .axis-col-2 { grid-column: 3; }
        .axis-sep-2 { grid-column: 4; }
        .axis-col-3 { grid-column: 5; }

        .axis-label-item {
            font-size: 7.5px;
            color: var(--text-sub);
            letter-spacing: 0.05em;
            font-weight: bold;
            margin-bottom: 2px;
            white-space: nowrap;
        }

        .axis-val-item {
            font-size: clamp(16px, 5vw, 21px);
            font-weight: 900;
            letter-spacing: 0.03em;
            white-space: nowrap;
        }

        .axis-separator {
            color: var(--text-sub);
            font-weight: normal;
            font-size: 14px;
            padding: 0 2px;
        }

        .catchphrase {
            font-size: 11px;
            font-weight: bold;
            color: var(--text-main);
            margin-bottom: 10px;
            text-align: center;
            word-break: break-all;
        }

        .image-section {
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: rgba(0, 0, 0, 0.03);
            border-radius: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-sub);
            margin-bottom: 10px;
            border: none;
            position: relative;
            overflow: hidden;
            text-align: center;
            font-size: 0.75rem;
        }

        .image-section img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 0;
        }

        .section-block {
            margin-bottom: 10px;
            background-color: transparent;
            padding: 4px 0;
            border: none;
        }

        .axis-item {
            margin-bottom: 6px;
        }

        .axis-name {
            font-size: 10px;
            font-weight: bold;
            color: var(--text-main);
        }

        .axis-desc {
            font-size: 8.5px;
            color: var(--text-sub);
            margin-top: 2px;
            line-height: 1.4;
            min-height: 2.8em;
        }

        .desc-sentence {
            display: block;
        }

        .desc-keywords {
            display: block;
            font-size: 7.5px;
            color: #888888;
            margin-top: 2px;
        }

        /* グラフ化表示エリアのスタイル（3等分横並びレイアウト） */
        .all-scores-graph-section {
            background-color: transparent;
            padding: 6px 0;
            margin-bottom: 10px;
            border-top: 1px dashed var(--border-color);
        }

        .graphs-wrapper {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            align-items: start;
        }

        .graph-column {
            background: transparent;
        }

        .graph-category-title {
            font-size: 8px;
            font-weight: bold;
            color: var(--text-sub);
            margin: 6px 0 4px 0;
            letter-spacing: 0.02em;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .graph-row {
            display: flex;
            align-items: center;
            margin-bottom: 2.5px;
            font-size: 7.5px;
        }

        .graph-label {
            width: 22px;
            font-weight: bold;
            text-align: right;
            margin-right: 2px;
            flex-shrink: 0;
            font-size: 7px;
        }

        .graph-bar-container {
            flex-grow: 1;
            background-color: #f0f0f0;
            height: 6px;
            position: relative;
            overflow: hidden;
        }

        .graph-bar-fill {
            height: 100%;
            transition: width 0.3s ease;
        }

        .graph-score-text {
            width: 24px;
            text-align: right;
            margin-left: 2px;
            font-size: 6.5px;
            color: var(--text-sub);
            flex-shrink: 0;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- START SCREEN -->
    <div id="screen-start" class="screen active">
        <div class="start-container">
            <h1 class="main-title">私という作風2</h1>
            <p class="subtitle">
                あなたは、何を美しいと思い、<br>
                何を通して表現し、<br>
                何を誰かにもたらしたい人？<br><br>
                全39問の質問から、あなたの「創作の傾向」を診断します。<br><br>
                <span style="font-size: 0.75rem; color: var(--text-sub);">※本診断で使用している画像はAIによって生成されています。</span>
            </p>
            <button class="btn btn-start" onclick="startQuiz()">診断を開始する</button>
        </div>
    </div>

    <!-- QUIZ SCREEN -->
    <div id="screen-quiz" class="screen">
        <div class="q-header">
            <span class="q-number" id="q-number">Q1 / 39</span>
        </div>
        <div class="q-title" id="q-title">質問タイトル</div>
        <div id="q-content-area"></div>
        <div class="btn-group">
            <button class="btn btn-secondary" id="btn-prev-q" onclick="prevQuestion()">一つ戻る</button>
        </div>
    </div>

    <!-- IMAGE UPLOAD SCREEN -->
    <div id="screen-image" class="screen">
        <div class="q-header">
            <span class="q-number">VISUAL</span>
        </div>
        <div class="q-title">あなたを象徴する画像を1枚選んでください（比率16:9固定）</div>
        <div class="file-upload-wrapper">
            <label class="file-label" id="file-label-box" for="char-image-input">
                <span id="file-label-text">画像ファイルを選択 (ローカル処理)</span>
                <img id="preview-img" class="preview-mini" src="" alt="preview">
            </label>
            <input type="file" id="char-image-input" class="file-input" accept="image/*" onchange="handleImageUpload(event)">
        </div>
        <div class="btn-group">
            <button class="btn btn-secondary" onclick="prevScreenFromImage()">戻る</button>
            <button class="btn" id="btn-show-result" onclick="calculateAndShowResult()" disabled>結果を見る</button>
        </div>
    </div>

    <!-- RESULT SCREEN -->
    <div id="screen-result" class="screen">
        <div class="result-card-container">
            <div class="result-card" id="result-card">
                
                <!-- ① タイトル -->
                <div class="card-header">
                    <p class="app-title">512 TYPES</p>
                    <h2 style="margin:0; font-size: 15px;">私という作風</h2>
                </div>

                <!-- ② 3軸グリッド ([MEDIUM] × [STYLE] × [PURPOSE]) -->
                <div class="axes-grid-layout" id="res-axes-grid"></div>

                <!-- ③ キャッチコピー ([PURPOSE]、[STYLE]) -->
                <div class="catchphrase" id="res-catchphrase"></div>

                <!-- ④ あなたを象徴する一枚 -->
                <div class="image-section" id="imageDropZone">
                    <img id="res-image" src="" alt="Character" style="display:none;">
                    <span id="res-image-placeholder">[ あなたを象徴する一枚 (16:9) ]<br>画像をここに配置</span>
                </div>

                <!-- ⑤ 3軸の解説 -->
                <div class="section-block">
                    <div id="res-axis-details"></div>
                </div>

                <!-- ⑥ 全項目のスコアグラフ表示（3等分横並び） -->
                <div class="all-scores-graph-section" id="res-all-scores-graph"></div>

            </div>
        </div>

        <div class="btn-group" style="margin-bottom: 20px;">
            <button class="btn" onclick="downloadResultImage()">結果を画像で保存・ダウンロード</button>
            
            <div style="text-align: center; margin: 16px 0; font-size: 0.8rem; color: var(--text-sub); letter-spacing: 0.1em;">
                <div style="font-weight: 700; font-size: 0.75rem; margin-bottom: 3px;">SHARE YOUR STYLE</div>
                <div>結果画像を保存して、Xでシェアしよう。</div>
            </div>

            <button class="btn btn-secondary" onclick="backToImageScreen()">回答や写真を修正する</button>
            <button class="btn btn-secondary" onclick="restart()">最初からやり直す</button>
        </div>
    </div>

</div>

<script>
// ご自身のGoogle Apps Script（GAS）ウェブアプリのURL
const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbw3FEnDk7Q_cC2neeP7wQshupYrUh8SuO-wBKsXRTFlTnD4Dbb0BA6dzZwL8ok-hN2M/exec";

const COLOR_STYLE = {
    "再現": "#FF6B6B", "理想": "#FFA94D", "表現": "#F06595", "知覚": "#FCC419",
    "構成": "#748FFC", "幻想": "#B197FC", "概念": "#4DABF7", "変容": "#38D9A9"
};

const COLOR_MEDIUM = {
    "視覚": "#FF8787", "造形": "#FFC078", "空間": "#FFD43B", "音響": "#63E6BE",
    "言語": "#4DABF7", "身体": "#E599F7", "映像": "#F783AC", "体験": "#39D39F"
};

const COLOR_PURPOSE = {
    "美":   "#F06595", "探究": "#748FFC", "伝達": "#38D9A9", "共感": "#63E6BE",
    "娯楽": "#FFA94D", "思索": "#B197FC", "癒し": "#20C997", "感動": "#FF6B6B"
};

// 全39問の質問データ (全項目に1〜8の番号を付与済み)
const QUESTIONS = [
    { q: "好きな分野は？", category: "MEDIUM", items: [
        { label: "視覚", img: "./images/A1視覚.jpg", caption: "絵画" }, 
        { label: "造形", img: "./images/A2造形.jpg", caption: "彫刻" },
        { label: "空間", img: "./images/A3空間.jpg", caption: "建築" }, 
        { label: "音響", img: "./images/A4音響.jpg", caption: "音楽" },
        { label: "言語", img: "./images/A5言語.jpg", caption: "戯曲" }, 
        { label: "身体", img: "./images/A6身体.jpg", caption: "演劇" },
        { label: "映像", img: "./images/A7映像.jpg", caption: "映画" }, 
        { label: "体験", img: "./images/A8体験.jpg", caption: "AR" }
    ]},
    { q: "好きな絵画は？", category: "STYLE", items: [
        { label: "再現", img: "./images/Aa1再現.jpg", caption: "写実主義" }, 
        { label: "理想", img: "./images/Aa2理想.jpg", caption: "新古典主義" },
        { label: "表現", img: "./images/Aa3表現.jpg", caption: "ロマン主義" }, 
        { label: "知覚", img: "./images/Aa4知覚.jpg", caption: "印象主義" },
        { label: "構成", img: "./images/Aa5構成.jpg", caption: "キュビスム" }, 
        { label: "幻想", img: "./images/Aa6幻想.jpg", caption: "象徴主義" },
        { label: "概念", img: "./images/Aa7概念.jpg", caption: "ダダ" }, 
        { label: "変容", img: "./images/Aa8変容.jpg", caption: "抽象主義" }
    ]},
    { q: "好きな絵画は？", category: "STYLE", items: [
        { label: "再現", img: "./images/Ab1再現.jpg", caption: "ハイパーリアリズム" }, 
        { label: "理想", img: "./images/Ab2理想.jpg", caption: "アール・ヌーヴォー" },
        { label: "表現", img: "./images/Ab3表現.jpg", caption: "フォービズム" }, 
        { label: "知覚", img: "./images/Ab4知覚.jpg", caption: "ポスト印象主義" },
        { label: "構成", img: "./images/Ab5構成.jpg", caption: "アールデコ" }, 
        { label: "幻想", img: "./images/Ab6幻想.jpg", caption: "シュルレアリスム" },
        { label: "概念", img: "./images/Ab7概念.jpg", caption: "ポップアート" }, 
        { label: "変容", img: "./images/Ab8変容.jpg", caption: "抽象表現主義" }
    ]},
    { q: "好きな版画は？", category: "STYLE", items: [
        { label: "再現", img: "./images/Ac1再現.jpg", caption: "エッチング" }, 
        { label: "理想", img: "./images/Ac2理想.jpg", caption: "エングレーヴィング" },
        { label: "表現", img: "./images/Ac3表現.jpg", caption: "粗削りな木版画" }, 
        { label: "知覚", img: "./images/Ac4知覚.jpg", caption: "カラー・リトグラフ" },
        { label: "構成", img: "./images/Ac5構成.jpg", caption: "幾何学的リトグラフ" }, 
        { label: "幻想", img: "./images/Ac6幻想.jpg", caption: "アクアチント銅版画" },
        { label: "概念", img: "./images/Ac7概念.jpg", caption: "シルクスクリーン" }, 
        { label: "変容", img: "./images/Ac8変容.jpg", caption: "減法木版・モノタイプ" }
    ]},
    { q: "好きなグラフィックは？", category: "PURPOSE", items: [
        { label: "美", img: "./images/Ad1美.jpg", caption: "スイス・スタイル" }, 
        { label: "探究", img: "./images/Ad2探求.jpg", caption: "バウハウス抽象構成" },
        { label: "伝達", img: "./images/Ad3伝達.jpg", caption: "ISOTYPEインフォ" }, 
        { label: "共感", img: "./images/Ad4共感.jpg", caption: "シルクスクリーン・ポスター" },
        { label: "娯楽", img: "./images/Ad5娯楽.jpg", caption: "ミッドセンチュリー・ポップ" },

function hexToRgb(hex) {
    let cleanHex = hex.replace('#', '');
    if (cleanHex.length === 3) {
        cleanHex = cleanHex.split('').map(char => char + char).join('');
    }
    const num = parseInt(cleanHex, 16);
    return {
        r: (num >> 16) & 255,
        g: (num >> 8) & 255,
        b: num & 255
    };
}

function formatDescWithLineBreaks(text, keywords) {
    const sentences = text.split('。').filter(s => s.trim().length > 0).map(s => s + '。');
    let html = '';
    sentences.forEach(s => {
        html += `<span class="desc-sentence">${s}</span>`;
    });
    if (keywords) {
        html += `<span class="desc-keywords">[${keywords}]</span>`;
    }
    return html;
}

function showScreen(screenId) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(screenId).classList.add('active');
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

    subInstruction.textContent = "※問題内の画像はAI生成画像です。";
    contentArea.appendChild(subInstruction);

    const optionsGrid = document.createElement('div');
    optionsGrid.className = 'options-grid';

    let currentSelections = userAnswers[currentQuestionIndex];
    if (!Array.isArray(currentSelections)) {
        currentSelections = [];
    }

    qData.items.forEach((itemData) => {
        const gridCell = document.createElement('div');
        gridCell.className = 'grid-cell';

        const gridItem = document.createElement('div');
        gridItem.className = 'grid-item';
        
        const selectionIndex = currentSelections.indexOf(itemData.label);
        if (selectionIndex > -1) {
            gridItem.classList.add('selected');
            gridItem.classList.add(`selected-${selectionIndex + 1}`);
        }

        gridItem.innerHTML = `<img src="${itemData.img}" alt="${itemData.label}" draggable="false">`;
        gridItem.onclick = () => toggleGridItemSelection(itemData.label);
        
        gridCell.appendChild(gridItem);

        if (itemData.caption) {
            const itemCaption = document.createElement('div');
            itemCaption.className = 'item-caption';
            itemCaption.textContent = itemData.caption;
            gridCell.appendChild(itemCaption);
        }

        optionsGrid.appendChild(gridCell);
    });
    contentArea.appendChild(optionsGrid);

    const prevBtn = document.getElementById('btn-prev-q');
    if (currentQuestionIndex === 0) {
        prevBtn.textContent = "TOPへ戻る";
        prevBtn.onclick = () => showScreen('screen-start');
    } else {
        prevBtn.textContent = "一つ戻る";
        prevBtn.onclick = () => prevQuestion();
    }
}

function updateLiveCardBackground() {
    const res = calculateScores();
    const finalStyle = res.style.rank1.key;
    const finalMedium = res.medium.rank1.key;
    const finalPurpose = res.purpose.rank1.key;

    const colorS = COLOR_STYLE[finalStyle] || "#cccccc";
    const colorM = COLOR_MEDIUM[finalMedium] || "#cccccc";
    const colorP = COLOR_PURPOSE[finalPurpose] || "#cccccc";

    const rgbS = hexToRgb(colorS);
    const rgbM = hexToRgb(colorM);
    const rgbP = hexToRgb(colorP);

    const answeredCount = userAnswers.filter(ans => Array.isArray(ans) && ans.length > 0).length;
    const progressRate = answeredCount / QUESTIONS.length;
    const colorAlpha = 0.15 + (0.45 * progressRate);

    const gradVal = `linear-gradient(135deg, 
        rgba(255, 255, 255, 1) 0%, 
        rgba(${rgbM.r}, ${rgbM.g}, ${rgbM.b}, ${colorAlpha}) 35%, 
        rgba(${rgbS.r}, ${rgbS.g}, ${rgbS.b}, ${colorAlpha}) 70%, 
        rgba(${rgbP.r}, ${rgbP.g}, ${rgbP.b}, ${colorAlpha}) 100%)`;

    document.documentElement.style.setProperty('--live-grad', gradVal);
}

function toggleGridItemSelection(label) {
    let currentSelections = userAnswers[currentQuestionIndex];
    if (!Array.isArray(currentSelections)) {
        currentSelections = [];
    }

    const index = currentSelections.indexOf(label);
    if (index > -1) {
        currentSelections.splice(index, 1);
    } else {
        if (currentSelections.length < 2) {
            currentSelections.push(label);
        } else {
            currentSelections.shift();
            currentSelections.push(label);
        }
    }

    userAnswers[currentQuestionIndex] = currentSelections;
    
    updateLiveCardBackground();
    renderQuestion();

    if (currentSelections.length === 2) {
        setTimeout(() => {
            if (currentQuestionIndex < QUESTIONS.length - 1) {
                currentQuestionIndex++;
                renderQuestion();
            } else {
                showScreen('screen-image');
            }
        }, 300);
    }
}

function prevQuestion() {
    if (currentQuestionIndex > 0) {
        currentQuestionIndex--;
        updateLiveCardBackground();
        renderQuestion();
    }
}

function prevScreenFromImage() {
    currentQuestionIndex = QUESTIONS.length - 1;
    renderQuestion();
    showScreen('screen-quiz');
}

function backToImageScreen() {
    showScreen('screen-image');
}

function handleImageUpload(event) {
    const file = event.target.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
            uploadedImageData = e.target.result;
            const preview = document.getElementById('preview-img');
            preview.src = uploadedImageData;
            preview.style.display = 'block';
            document.getElementById('file-label-text').textContent = "画像を変更する";
            document.getElementById('btn-show-result').disabled = false;
            document.getElementById('file-label-box').classList.add('has-image');
        };
        reader.readAsDataURL(file);
    }
}

function calculateScores() {
    const scoreMap = { STYLE: {}, MEDIUM: {}, PURPOSE: {} };
    
    STYLE_ORDER.forEach(k => scoreMap.STYLE[k] = { total: 0, mainCount: 0, subCount: 0, grid1Count: 0, grid2Count: 0 });
    MEDIUM_ORDER.forEach(k => scoreMap.MEDIUM[k] = { total: 0, mainCount: 0, subCount: 0, grid1Count: 0, grid2Count: 0 });
    PURPOSE_ORDER.forEach(k => scoreMap.PURPOSE[k] = { total: 0, mainCount: 0, subCount: 0, grid1Count: 0, grid2Count: 0 });

    userAnswers.forEach((ansData, qIdx) => {
        if (ansData === undefined) return;
        const qData = QUESTIONS[qIdx];

        if (Array.isArray(ansData)) {
            const category = qData.category;
            ansData.forEach((selectedKey, idx) => {
                if (scoreMap[category][selectedKey]) {
                    const points = (idx === 0) ? 2 : 1;
                    scoreMap[category][selectedKey].total += points;
                    
                    if (idx === 0) {
                        scoreMap[category][selectedKey].grid1Count += 1;
                    } else {
                        scoreMap[category][selectedKey].grid2Count += 1;
                    }
                }
            });
        }
    });

    function getSortedRankList(category, orderList) {
        const catMap = scoreMap[category];
        const sortedDesc = [...orderList].sort((a, b) => {
            const itemA = catMap[a];
            const itemB = catMap[b];
            
            if (itemB.total !== itemA.total) return itemB.total - itemA.total;
            if (itemB.mainCount !== itemA.mainCount) return itemB.mainCount - itemA.mainCount;
            if (itemB.grid1Count !== itemA.grid1Count) return itemB.grid1Count - itemA.grid1Count;
            if (itemB.grid2Count !== itemA.grid2Count) return itemB.grid2Count - itemA.grid2Count;
            if (itemB.subCount !== itemA.subCount) return itemB.subCount - itemA.subCount;
            
            return orderList.indexOf(a) - orderList.indexOf(b);
        });

        const top1Score = catMap[sortedDesc[0]].total;
        const top2Score = catMap[sortedDesc[1]].total;
        const ratio2 = top1Score > 0 ? (top2Score / top1Score) : 1.0;

        return {
            rank1: { key: sortedDesc[0], score: top1Score },
            rank2: { key: sortedDesc[1], score: top2Score, ratio: ratio2 },
            diff2Percent: top1Score > 0 ? ((top1Score - top2Score) / top1Score) * 100 : 0,
            fullMap: catMap,
            sortedKeys: sortedDesc
        };
    }

    const styleRes = getSortedRankList("STYLE", STYLE_ORDER);
    const mediumRes = getSortedRankList("MEDIUM", MEDIUM_ORDER);
    const purposeRes = getSortedRankList("PURPOSE", PURPOSE_ORDER);

    return {
        style: styleRes,
        medium: mediumRes,
        purpose: purposeRes,
        avgDiffPercent: (styleRes.diff2Percent + mediumRes.diff2Percent + purposeRes.diff2Percent) / 3
    };
}

function recordDownloadStats(finalStyle, finalMedium, finalPurpose) {
    try {
        const STORAGE_KEY = "creative_style_dl_stats_v1";
        let stats = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {
            totalDownloads: 0,
            STYLE: {},
            MEDIUM: {},
            PURPOSE: {}
        };

        STYLE_ORDER.forEach(k => { if (!stats.STYLE[k]) stats.STYLE[k] = 0; });
        MEDIUM_ORDER.forEach(k => { if (!stats.MEDIUM[k]) stats.MEDIUM[k] = 0; });
        PURPOSE_ORDER.forEach(k => { if (!stats.PURPOSE[k]) stats.PURPOSE[k] = 0; });

        stats.totalDownloads += 1;
        stats.STYLE[finalStyle] += 1;
        stats.MEDIUM[finalMedium] += 1;
        stats.PURPOSE[finalPurpose] += 1;

        localStorage.setItem(STORAGE_KEY, JSON.stringify(stats));

        if (GAS_WEB_APP_URL && GAS_WEB_APP_URL !== "") {
            fetch(GAS_WEB_APP_URL, {
                method: "POST",
                mode: "no-cors",
                headers: {
                    "Content-Type": "application/json",
                },
                body: JSON.stringify({
                    style: finalStyle,
                    medium: finalMedium,
                    purpose: finalPurpose
                })
            }).catch(err => {
                console.error("GAS送信エラー:", err);
            });
        }
    } catch (e) {
        console.error("集計データの保存に失敗しました", e);
    }
}

function calculateAndShowResult() {
    if (!uploadedImageData) return;
    const res = calculateScores();
    calculatedResultsData = res;

    const finalStyle = res.style.rank1.key;
    const finalMedium = res.medium.rank1.key;
    const finalPurpose = res.purpose.rank1.key;

    const colorS = COLOR_STYLE[finalStyle] || "#222222";
    const colorM = COLOR_MEDIUM[finalMedium] || "#222222";
    const colorP = COLOR_PURPOSE[finalPurpose] || "#222222";

    const rgbS = hexToRgb(colorS);
    const rgbM = hexToRgb(colorM);
    const rgbP = hexToRgb(colorP);

    const resultCard = document.getElementById('result-card');
    resultCard.style.background = `linear-gradient(135deg, 
        rgba(255, 255, 255, 1) 0%, 
        rgba(${rgbM.r}, ${rgbM.g}, ${rgbM.b}, 0.35) 35%, 
        rgba(${rgbS.r}, ${rgbS.g}, ${rgbS.b}, 0.35) 70%, 
        rgba(${rgbP.r}, ${rgbP.g}, ${rgbP.b}, 0.35) 100%)`;

    document.getElementById('res-axes-grid').innerHTML = `
        <div class="axis-col-1 axis-label-item">[MEDIUM]</div>
        <div class="axis-sep-1 axis-separator" style="visibility:hidden;">×</div>
        <div class="axis-col-2 axis-label-item">[STYLE]</div>
        <div class="axis-sep-2 axis-separator" style="visibility:hidden;">×</div>
        <div class="axis-col-3 axis-label-item">[PURPOSE]</div>

        <div class="axis-col-1 axis-val-item" style="color: ${colorM}">${finalMedium}</div>
        <div class="axis-sep-1 axis-separator">×</div>
        <div class="axis-col-2 axis-val-item" style="color: ${colorS}">${finalStyle}</div>
        <div class="axis-sep-2 axis-separator">×</div>
        <div class="axis-col-3 axis-val-item" style="color: ${colorP}">${finalPurpose}</div>
    `;

    const dataP = DATA_PURPOSE[finalPurpose];
    const dataS = DATA_STYLE[finalStyle];
    
    document.getElementById('res-catchphrase').textContent = `${dataP.catchPhrase}、${dataS.catchPhrase}`;

    const resImg = document.getElementById('res-image');
    resImg.src = uploadedImageData;
    resImg.style.display = 'block';
    document.getElementById('res-image-placeholder').style.display = 'none';

    const dataMed = DATA_MEDIUM[finalMedium];
    
    const formattedDescS = formatDescWithLineBreaks(dataS.text, dataS.keywords);
    const formattedDescMed = formatDescWithLineBreaks(dataMed.text, dataMed.keywords);
    const formattedDescP = formatDescWithLineBreaks(dataP.text, dataP.keywords);

    document.getElementById('res-axis-details').innerHTML = `
        <div class="axis-item">
            <div class="axis-name">MEDIUM：<span style="color: ${colorM}">${finalMedium}</span> ｜ ${dataMed.title.split(' ｜ ')[1]}</div>
            <div class="axis-desc">${formattedDescMed}</div>
        </div>
        <div class="axis-item">
            <div class="axis-name">STYLE：<span style="color: ${colorS}">${finalStyle}</span> ｜ ${dataS.title.split(' ｜ ')[1]}</div>
            <div class="axis-desc">${formattedDescS}</div>
        </div>
        <div class="axis-item">
            <div class="axis-name">PURPOSE：<span style="color: ${colorP}">${finalPurpose}</span> ｜ ${dataP.title}</div>
            <div class="axis-desc">${formattedDescP}</div>
        </div>
    `;

    function generateSingleCategoryGraphHTML(categoryName, orderList, fullMap, colorDict) {
        let maxScore = 1;
        orderList.forEach(k => {
            if (fullMap[k].total > maxScore) maxScore = fullMap[k].total;
        });

        let html = `<div class="graph-category-title">${categoryName}</div>`;
        orderList.forEach(k => {
            const score = fullMap[k].total;
            const percentage = (score / maxScore) * 100;
            const barColor = colorDict[k] || "#222222";
            html += `
                <div class="graph-row">
                    <div class="graph-label">${k}</div>
                    <div class="graph-bar-container">
                        <div class="graph-bar-fill" style="width: ${percentage}%; background-color: ${barColor};"></div>
                    </div>
                    <div class="graph-score-text">${score}</div>
                </div>
            `;
        });
        return html;
    }

    const colMedium = generateSingleCategoryGraphHTML("MEDIUM", MEDIUM_ORDER, res.medium.fullMap, COLOR_MEDIUM);
    const colStyle = generateSingleCategoryGraphHTML("STYLE", STYLE_ORDER, res.style.fullMap, COLOR_STYLE);
    const colPurpose = generateSingleCategoryGraphHTML("PURPOSE", PURPOSE_ORDER, res.purpose.fullMap, COLOR_PURPOSE);

    const graphHtml = `
        <div class="graphs-wrapper">
            <div class="graph-column">${colMedium}</div>
            <div class="graph-column">${colStyle}</div>
            <div class="graph-column">${colPurpose}</div>
        </div>
    `;

    document.getElementById('res-all-scores-graph').innerHTML = graphHtml;

    showScreen('screen-result');
}

function downloadResultImage() {
    if (isDownloading) return;
    isDownloading = true;

    if (calculatedResultsData) {
        recordDownloadStats(
            calculatedResultsData.style.rank1.key,
            calculatedResultsData.medium.rank1.key,
            calculatedResultsData.purpose.rank1.key
        );
    }

    const sourceCard = document.getElementById('result-card');

    document.fonts.ready.then(() => {
        html2canvas(sourceCard, {
            scale: 2,
            useCORS: true,
            backgroundColor: null,
            windowWidth: 540
        }).then(sourceCanvas => {
            const targetWidth = 1080;
            const targetHeight = 1920;
            const finalCanvas = document.createElement('canvas');
            finalCanvas.width = targetWidth;
            finalCanvas.height = targetHeight;
            const ctx = finalCanvas.getContext('2d');

            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, targetWidth, targetHeight);

            const cardBgColor = sourceCard.style.background;
            if (cardBgColor) {
                ctx.fillStyle = cardBgColor;
                ctx.fillRect(0, 0, targetWidth, targetHeight);
            }

            ctx.drawImage(
                sourceCanvas, 
                0, 0, sourceCanvas.width, sourceCanvas.height, 
                0, 0, targetWidth, targetHeight
            );

            finalCanvas.toBlob(blob => {
                const file = new File([blob], `creative-style-result.png`, { type: 'image/png' });
                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    navigator.share({
                        files: [file],
                        title: '私という作風',
                        text: '私の創作診断結果です！'
                    }).catch(() => {}).finally(() => { isDownloading = false; });
                } else {
                    const link = document.createElement('a');
                    link.download = `creative-style-result.png`;
                    link.href = URL.createObjectURL(blob);
                    link.click();
                    setTimeout(() => { isDownloading = false; }, 500);
                }
            }, 'image/png');
        }).catch(() => { isDownloading = false; });
    });
}

function restart() {
    currentQuestionIndex = 0;
    userAnswers = [];
    uploadedImageData = null;
    calculatedResultsData = null;
    isDownloading = false;
    document.getElementById('preview-img').style.display = 'none';
    document.getElementById('preview-img').src = '';
    document.getElementById('file-label-text').textContent = "画像ファイルを選択 (ローカル処理)";
    document.getElementById('file-label-box').classList.remove('has-image');
    document.getElementById('btn-show-result').disabled = true;
    document.getElementById('char-image-input').value = '';
    document.documentElement.style.setProperty('--live-grad', '#ffffff');
    showScreen('screen-start');
}
