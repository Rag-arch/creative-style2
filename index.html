<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>私という作風2</title>

    <!-- ▼▼▼ OGP・X用カード設定 ▼▼▼ -->
    <meta property="og:title" content="私という作風2 - 創作の傾向診断">
    <meta property="og:description" content="全32問の質問と画像選択から、あなたの「創作の傾向（3軸の組み合わせ）」を診断します。">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://rag-arch.github.io/creative-style">
    <meta property="og:image" content="https://rag-arch.github.io/creative-style/ogp-v3.png">
    <meta property="og:site_name" content="私という作風2">

    <meta name="twitter:card" content="summary_large_image">
    <!-- ▲▲▲ OGP設定ここまで ▲▲▲ -->

    <!-- html2canvas ライブラリ (画像ダウンロード機能用) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --bg-color: #ffffff;
            --card-bg: #ffffff;
            --text-main: #111111;
            --text-sub: #555555;
            --accent-color: #1a1a1a;
            --border-color: #dcdcdc;
            --font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI", "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            --live-grad: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-text-size-adjust: 100%;
        }

        body {
            background-color: var(--bg-color);
            background-image: var(--live-grad);
            background-attachment: fixed;
            color: var(--text-main);
            font-family: var(--font-family);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 12px;
            letter-spacing: 0.05em;
            line-height: 1.5;
            overflow-x: hidden;
            transition: background-image 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 540px;
            margin: 0 auto;
            position: relative;
            z-index: 10;
        }

        .screen {
            display: none;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .screen.active {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        .start-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 100%;
            margin: 0 auto;
            padding: 20px 0;
        }

        h1.main-title {
            font-size: 2.6rem;
            font-weight: 900;
            text-align: center;
            letter-spacing: 0.25em;
            margin-bottom: 1.5rem;
            color: var(--text-main);
            position: relative;
            display: inline-block;
            background: linear-gradient(135deg, #111111 30%, #555555 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            text-align: center;
            font-size: 0.9rem;
            color: var(--text-sub);
            margin-bottom: 2rem;
            line-height: 1.9;
            width: 100%;
        }

        .btn {
            display: inline-block;
            width: 100%;
            padding: 16px 24px;
            background: #1a1a1a;
            color: #ffffff;
            border: 1px solid #1a1a1a;
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 0.15em;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.165, 0.84, 0.44, 1);
            text-align: center;
            text-decoration: none;
            border-radius: 0;
            position: relative;
            overflow: hidden;
        }

        .btn::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: 0.5s;
        }

        .btn:hover::after {
            left: 100%;
        }

        .btn-start {
            width: 100%;
        }

        .btn:hover {
            background: #ffffff;
            color: #1a1a1a;
            border-color: #1a1a1a;
            transform: translateY(-2px);
        }

        .btn:disabled {
            border-color: #cccccc;
            color: #cccccc;
            cursor: not-allowed;
            background: transparent;
            transform: none;
        }

        .btn:disabled::after {
            display: none;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 16px;
            width: 100%;
        }

        .btn-secondary {
            border-color: var(--border-color);
            color: var(--text-main);
            background: #fafafa;
        }

        .btn-secondary:hover {
            background: #f0f0f0;
            color: #000000;
            border-color: #1a1a1a;
        }

        .q-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.2rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        .q-number {
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.15em;
            color: var(--text-main);
        }

        .q-title {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            text-align: center;
            line-height: 1.5;
            color: var(--text-main);
        }

        .grid-instruction {
            font-size: 0.85rem;
            text-align: center;
            color: var(--text-main);
            margin-bottom: 0.3rem;
            font-weight: 600;
        }

        .grid-sub-instruction {
            font-size: 0.75rem;
            text-align: center;
            color: var(--text-sub);
            margin-bottom: 1rem;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px 8px;
            margin-bottom: 0.5rem;
        }

        .grid-cell {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .grid-item {
            width: 100%;
            aspect-ratio: 1 / 1;
            border: 2px solid var(--border-color);
            cursor: pointer;
            position: relative;
            overflow: hidden;
            background: #f0f0f0;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .grid-item:hover {
            transform: scale(1.05);
            border-color: #1a1a1a;
        }

        .grid-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            pointer-events: none;
            user-select: none;
        }

        .item-caption {
            display: none;
            font-size: 0.5rem;
            color: var(--text-sub);
            text-align: center;
            margin-top: 4px;
        }

        .grid-item.selected {
            border-color: #1a1a1a;
            box-shadow: 0 0 0 2px #1a1a1a;
            transform: scale(1.03);
        }

        .grid-item.selected-1::after {
            content: "1";
            position: absolute;
            top: 4px;
            right: 4px;
            background: #1a1a1a;
            color: #ffffff;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: bold;
        }

        .grid-item.selected-2::after {
            content: "2";
            position: absolute;
            top: 4px;
            right: 4px;
            background: #777777;
            color: #ffffff;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: bold;
        }

        .file-upload-wrapper {
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .file-input {
            display: none;
        }

        .file-label {
            border: 2px dashed var(--text-sub);
            padding: 30px 20px;
            display: block;
            cursor: pointer;
            background: #fafafa;
            transition: all 0.2s;
            color: var(--text-main);
        }

        .file-label:hover {
            border-color: var(--text-main);
            background: #f0f0f0;
        }

        .file-label.has-image {
            border: none;
            padding: 5px 0;
            background: transparent;
        }

        .preview-mini {
            max-width: 160px;
            max-height: 160px;
            margin: 10px auto 0;
            display: none;
            object-fit: cover;
        }

        .result-card-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            margin: 0 auto;
            animation: cardAppear 0.6s cubic-bezier(0.165, 0.84, 0.44, 1) forwards;
        }

        @keyframes cardAppear {
            0% { opacity: 0; transform: translateY(20px) scale(0.98); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* ▼▼▼ iPhone風モックアップの忠実な再現（キャプチャ時はカード部分のみ綺麗に抜く） ▼▼▼ */
        .iphone-frame {
            background-color: #111111;
            border-radius: 46px;
            padding: 42px 14px 68px 14px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 390px;
            position: relative;
            margin-bottom: 12px;
        }

        .iphone-speaker {
            position: absolute;
            top: 18px;
            left: 50%;
            transform: translateX(-50%);
            width: 56px;
            height: 5px;
            background-color: #333333;
            border-radius: 3px;
        }

        .iphone-home-btn {
            position: absolute;
            bottom: 14px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 40px;
            border: 2px solid #333333;
            border-radius: 50%;
            box-sizing: border-box;
        }

        .result-card {
            background-color: #ffffff;
            border-radius: 8px;
            padding: 16px 12px;
            width: 100%;
            transition: background 0.5s ease;
            overflow: hidden;
            color: var(--text-main);
            position: relative;
        }
        /* ▲▲▲ iPhone風モックアップここまで ▲▲▲ */

        .card-header {
            text-align: center;
            margin-bottom: 6px;
        }

        .app-title {
            font-size: 8px;
            color: var(--text-sub);
            letter-spacing: 0.1em;
            margin: 0 0 1px 0;
        }

        .axes-grid-layout {
            display: grid;
            grid-template-columns: 1fr auto 1fr auto 1fr;
            align-items: baseline;
            justify-items: center;
            max-width: 100%;
            margin: 0 auto 8px auto;
        }

        .axis-col-1 { grid-column: 1; }
        .axis-sep-1 { grid-column: 2; }
        .axis-col-2 { grid-column: 3; }
        .axis-sep-2 { grid-column: 4; }
        .axis-col-3 { grid-column: 5; }

        .axis-label-item {
            font-size: 7px;
            color: var(--text-sub);
            letter-spacing: 0.05em;
            font-weight: bold;
            margin-bottom: 2px;
            white-space: nowrap;
        }

        .axis-val-item {
            font-size: clamp(13px, 4vw, 17px);
            font-weight: 900;
            letter-spacing: 0.03em;
            white-space: nowrap;
        }

        .axis-separator {
            color: var(--text-sub);
            font-weight: normal;
            font-size: 12px;
            padding: 0 2px;
        }

        .catchphrase {
            font-size: 10px;
            font-weight: bold;
            color: var(--text-main);
            margin-bottom: 8px;
            text-align: center;
            word-break: break-all;
        }

        .image-section {
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: rgba(0, 0, 0, 0.05);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-sub);
            margin-bottom: 8px;
            overflow: hidden;
            text-align: center;
            font-size: 0.7rem;
        }

        .image-section img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 8px;
        }

        .section-block {
            margin-bottom: 8px;
        }

        .axis-item {
            margin-bottom: 4px;
        }

        .axis-name {
            font-size: 9px;
            font-weight: bold;
            color: var(--text-main);
        }

        .all-scores-graph-section {
            background-color: transparent;
            padding: 4px 0;
            margin-bottom: 6px;
            border-top: 1px dashed var(--border-color);
        }

        .graphs-wrapper {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            align-items: start;
        }

        .graph-column {
            background: transparent;
        }

        .graph-category-title {
            font-size: 7.5px;
            font-weight: bold;
            color: var(--text-sub);
            margin: 4px 0 2px 0;
            letter-spacing: 0.02em;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .graph-row {
            display: flex;
            align-items: center;
            margin-bottom: 2px;
            font-size: 7px;
        }

        .graph-label {
            width: 20px;
            font-weight: bold;
            text-align: right;
            margin-right: 2px;
            flex-shrink: 0;
            font-size: 6.5px;
            color: var(--text-main);
        }

        .graph-bar-container {
            flex-grow: 1;
            background-color: rgba(0, 0, 0, 0.08);
            height: 5px;
            position: relative;
            overflow: hidden;
            border-radius: 2px;
        }

        .graph-bar-fill {
            height: 100%;
            width: 0%;
            transition: width 0.8s cubic-bezier(0.1, 0.9, 0.2, 1);
            border-radius: 2px;
        }

        .graph-score-text {
            width: 20px;
            text-align: right;
            margin-left: 2px;
            font-size: 6px;
            color: var(--text-main);
            font-weight: bold;
            flex-shrink: 0;
        }
    </style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<div class="container">

    <!-- START SCREEN -->
    <div id="screen-start" class="screen active">
        <div class="start-container">
            <h1 class="main-title">私という作風2</h1>
            <p class="subtitle">
                あなたは、何を美しいと思い、<br>
                何を通して表現し、<br>
                何を誰かにもたらしたい人？<br><br>
                全32問の質問と画像選択から、あなたの「創作の傾向」を診断します。<br><br>
                <span style="font-size: 0.75rem; color: var(--text-sub); display: inline-block; margin-top: 4px;">※本診断で使用している画像はAIによって生成されています。</span>
            </p>
            <button class="btn btn-start" onclick="startQuiz()">診断を開始する</button>
        </div>
    </div>

    <!-- QUIZ SCREEN -->
    <div id="screen-quiz" class="screen">
        <div class="q-header">
            <span class="q-number" id="q-number">Q1 / 32</span>
        </div>
        <div class="q-title" id="q-title">質問タイトル</div>
        <div id="q-content-area"></div>
        <div class="btn-group">
            <button class="btn btn-secondary" id="btn-prev-q" onclick="prevQuestion()">一つ戻る</button>
        </div>
    </div>

    <!-- IMAGE UPLOAD SCREEN -->
    <div id="screen-image" class="screen">
        <div class="q-header">
            <span class="q-number">VISUAL</span>
        </div>
        <div class="q-title">あなたを象徴する画像を1枚選んでください（比率16:9固定）</div>
        <div class="file-upload-wrapper">
            <label class="file-label" id="file-label-box" for="char-image-input">
                <span id="file-label-text">画像ファイルを選択 (ローカル処理)</span>
                <img id="preview-img" class="preview-mini" src="" alt="preview">
            </label>
            <input type="file" id="char-image-input" class="file-input" accept="image/*" onchange="handleImageUpload(event)">
        </div>
        <div class="btn-group">
            <button class="btn btn-secondary" onclick="prevScreenFromImage()">戻る</button>
            <button class="btn" id="btn-show-result" onclick="calculateAndShowResult()" disabled>結果を見る</button>
        </div>
    </div>

    <!-- RESULT SCREEN -->
    <div id="screen-result" class="screen">
        <div class="result-card-container">
            <div class="iphone-frame" id="iphone-frame">
                <div class="iphone-speaker"></div>
                
                <div class="result-card" id="result-card">
                    <div class="card-header">
                        <p class="app-title">512 TYPES</p>
                        <h2 style="margin:0; font-size: 14px;">私という作風</h2>
                    </div>

                    <div class="axes-grid-layout" id="res-axes-grid"></div>

                    <div class="catchphrase" id="res-catchphrase"></div>

                    <div class="image-section" id="imageDropZone">
                        <img id="res-image" src="" alt="Character" style="display:none;">
                        <span id="res-image-placeholder">[ あなたを象徴する一枚 (16:9) ]<br>画像をここに配置</span>
                    </div>

                    <div class="section-block">
                        <div id="res-axis-details"></div>
                    </div>

                    <div class="all-scores-graph-section" id="res-all-scores-graph"></div>
                </div>

                <div class="iphone-home-btn"></div>
            </div>
        </div>

        <div class="btn-group" style="margin-bottom: 20px;">
            <button class="btn" onclick="downloadResultImage()">結果を画像で保存・ダウンロード</button>
            
            <div style="text-align: center; margin: 16px 0; font-size: 0.8rem; color: var(--text-sub); letter-spacing: 0.1em;">
                <div style="font-weight: 700; font-size: 0.75rem; margin-bottom: 3px;">SHARE YOUR STYLE</div>
                <div>結果画像を保存して、Xでシェアしよう。</div>
            </div>

            <button class="btn btn-secondary" onclick="backToImageScreen()">回答や写真を修正する</button>
            <button class="btn btn-secondary" onclick="restart()">最初からやり直す</button>
        </div>
    </div>

</div>

<script>
const COLOR_STYLE = {
    "再現": "#D9480F", "理想": "#E67700", "表現": "#C2255C", "知覚": "#F59F00",
    "構成": "#3B5BDB", "幻想": "#7950F2", "概念": "#1C7ED6", "変容": "#0B7285"
};

const COLOR_MEDIUM = {
    "視覚": "#E03131", "造形": "#D9480F", "空間": "#E67700", "音響": "#099268",
    "言語": "#1C7ED6", "身体": "#AE3EC9", "映像": "#C2255C", "体験": "#0CA678"
};

const COLOR_PURPOSE = {
    "美":   "#C2255C", "探究": "#3B5BDB", "伝達": "#0B7285", "共感": "#099268",
    "娯楽": "#E67700", "思索": "#7950F2", "癒し": "#0CA678", "感動": "#E03131"
};

const QUESTIONS = [
    { q: "好きな分野は？", category: "MEDIUM", items: [
        { label: "視覚", img: "./images/A1視覚.jpg", caption: "絵画" }, 
        { label: "造形", img: "./images/A2造形.jpg", caption: "彫刻" },
        { label: "空間", img: "./images/A3空間.jpg", caption: "建築" }, 
        { label: "音響", img: "./images/A4音響.jpg", caption: "音楽" },
        { label: "言語", img: "./images/A5言語.jpg", caption: "戯曲" }, 
        { label: "身体", img: "./images/A6身体.jpg", caption: "演劇" },
        { label: "映像", img: "./images/A7映像.jpg", caption: "映画" }, 
        { label: "体験", img: "./images/A8体験.jpg", caption: "AR" }
    ]},
    { q: "好きな絵画は？", category: "STYLE", items: [
        { label: "再現", img: "./images/Aa1再現.jpg", caption: "写実主義" }, 
        { label: "理想", img: "./images/Aa2理想.jpg", caption: "新古典主義" },
        { label: "表現", img: "./images/Aa3表現.jpg", caption: "ロマン主義" }, 
        { label: "知覚", img: "./images/Aa4知覚.jpg", caption: "印象主義" },
        { label: "構成", img: "./images/Aa5構成.jpg", caption: "キュビスム" }, 
        { label: "幻想", img: "./images/Aa6幻想.jpg", caption: "象徴主義" },
        { label: "概念", img: "./images/Aa7概念.jpg", caption: "ダダ" }, 
        { label: "変容", img: "./images/Aa8変容.jpg", caption: "抽象主義" }
    ]},
    { q: "好きな絵画は？", category: "STYLE", items: [
        { label: "再現", img: "./images/Ab1再現.jpg", caption: "ハイパーリアリズム" }, 
        { label: "理想", img: "./images/Ab2理想.jpg", caption: "アール・ヌーヴォー" },
        { label: "表現", img: "./images/Ab3表現.jpg", caption: "フォービズム" }, 
        { label: "知覚", img: "./images/Ab4知覚.jpg", caption: "ポスト印象主義" },
        { label: "構成", img: "./images/Ab5構成.jpg", caption: "アールデコ" }, 
        { label: "幻想", img: "./images/Ab6幻想.jpg", caption: "シュルレアリスム" },
        { label: "概念", img: "./images/Ab7概念.jpg", caption: "ポップアート" }, 
        { label: "変容", img: "./images/Ab8変容.jpg", caption: "抽象表現主義" }
    ]},
    { q: "好きな版画は？", category: "STYLE", items: [
        { label: "再現", img: "./images/Ac1再現.jpg", caption: "エッチング" }, 
        { label: "理想", img: "./images/Ac2理想.jpg", caption: "エングレーヴィング" },
        { label: "表現", img: "./images/Ac3表現.jpg", caption: "粗削りな木版画" }, 
        { label: "知覚", img: "./images/Ac4知覚.jpg", caption: "カラー・リトグラフ" },
        { label: "構成", img: "./images/Ac5構成.jpg", caption: "几何学的リトグラフ" },

function initParticleCanvas() {
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let width, height;
    let particles = [];

    function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    class Particle {
        constructor() { this.reset(); }
        reset() {
            this.x = Math.random() * width;
            this.y = Math.random() * height;
            this.size = Math.random() * 3 + 1;
            this.speedX = (Math.random() - 0.5) * 0.4;
            this.speedY = (Math.random() - 0.5) * 0.4;
            this.alpha = Math.random() * 0.5 + 0.1;
        }
        update() {
            this.x += this.speedX;
            this.y += this.speedY;
            if (this.x < 0 || this.x > width || this.y < 0 || this.y > height) this.reset();
        }
        draw() {
            ctx.fillStyle = `rgba(120, 120, 120, ${this.alpha})`;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    for (let i = 0; i < 45; i++) particles.push(new Particle());

    function animate() {
        ctx.clearRect(0, 0, width, height);
        particles.forEach(p => { p.update(); p.draw(); });
        requestAnimationFrame(animate);
    }
    animate();
}

function hexToRgb(hex) {
    let cleanHex = hex.replace('#', '');
    if (cleanHex.length === 3) cleanHex = cleanHex.split('').map(char => char + char).join('');
    const num = parseInt(cleanHex, 16);
    return { r: (num >> 16) & 255, g: (num >> 8) & 255, b: num & 255 };
}

function showScreen(screenId) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(screenId).classList.add('active');
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function startQuiz() {
    currentQuestionIndex = 0;
    userAnswers = [];
    updateLiveCardBackground();
    renderQuestion();
    showScreen('screen-quiz');
}

function renderQuestion() {
    const qData = QUESTIONS[currentQuestionIndex];
    document.getElementById('q-number').textContent = `Q${currentQuestionIndex + 1} / ${QUESTIONS.length}`;
    document.getElementById('q-title').textContent = qData.q;

    const contentArea = document.getElementById('q-content-area');
    contentArea.innerHTML = '';

    const instruction = document.createElement('div');
    instruction.className = 'grid-instruction';
    instruction.textContent = "画像の中から2つ選んでください（選んだ順番に1位2位表示）";
    contentArea.appendChild(instruction);

    const subInstruction = document.createElement('div');
    subInstruction.className = 'grid-sub-instruction';
    subInstruction.textContent = "※問題内の画像はAI生成画像です。";
    contentArea.appendChild(subInstruction);

    const optionsGrid = document.createElement('div');
    optionsGrid.className = 'options-grid';

    let currentSelections = userAnswers[currentQuestionIndex] || [];

    qData.items.forEach((itemData) => {
        const gridCell = document.createElement('div');
        gridCell.className = 'grid-cell';

        const gridItem = document.createElement('div');
        gridItem.className = 'grid-item';
        
        const selectionIndex = currentSelections.indexOf(itemData.label);
        if (selectionIndex > -1) {
            gridItem.classList.add('selected', `selected-${selectionIndex + 1}`);
        }

        gridItem.innerHTML = `<img src="${itemData.img}" alt="${itemData.label}" draggable="false" onerror="this.src='https://placehold.co/150x150/eee/333?text=${itemData.label}'">`;
        gridItem.onclick = () => toggleGridItemSelection(itemData.label);
        
        gridCell.appendChild(gridItem);

        if (itemData.caption) {
            const itemCaption = document.createElement('div');
            itemCaption.className = 'item-caption';
            itemCaption.textContent = itemData.caption;
            gridCell.appendChild(itemCaption);
        }

        optionsGrid.appendChild(gridCell);
    });
    contentArea.appendChild(optionsGrid);

    const prevBtn = document.getElementById('btn-prev-q');
    if (currentQuestionIndex === 0) {
        prevBtn.textContent = "TOPへ戻る";
        prevBtn.onclick = () => showScreen('screen-start');
    } else {
        prevBtn.textContent = "一つ戻る";
        prevBtn.onclick = () => prevQuestion();
    }
}

function updateLiveCardBackground() {
    const res = calculateScores();
    const finalStyle = res.style.rank1.key;
    const finalMedium = res.medium.rank1.key;
    const finalPurpose = res.purpose.rank1.key;

    const colorS = COLOR_STYLE[finalStyle] || "#cccccc";
    const colorM = COLOR_MEDIUM[finalMedium] || "#cccccc";
    const colorP = COLOR_PURPOSE[finalPurpose] || "#cccccc";

    const rgbS = hexToRgb(colorS);
    const rgbM = hexToRgb(colorM);
    const rgbP = hexToRgb(colorP);

    const answeredCount = userAnswers.filter(ans => Array.isArray(ans) && ans.length > 0).length;
    const progressRate = answeredCount / QUESTIONS.length;
    const colorAlpha = 0.03 + (0.08 * progressRate);

    const gradVal = `linear-gradient(135deg, 
        rgba(255, 255, 255, 1) 0%, 
        rgba(${rgbM.r}, ${rgbM.g}, ${rgbM.b}, ${colorAlpha}) 35%, 
        rgba(${rgbS.r}, ${rgbS.g}, ${rgbS.b}, ${colorAlpha}) 70%, 
        rgba(${rgbP.r}, ${rgbP.g}, ${rgbP.b}, ${colorAlpha}) 100%)`;

    document.documentElement.style.setProperty('--live-grad', gradVal);
}

function toggleGridItemSelection(label) {
    let currentSelections = userAnswers[currentQuestionIndex] || [];

    const index = currentSelections.indexOf(label);
    if (index > -1) {
        currentSelections.splice(index, 1);
    } else {
        if (currentSelections.length < 2) {
            currentSelections.push(label);
        } else {
            currentSelections.shift();
            currentSelections.push(label);
        }
    }

    userAnswers[currentQuestionIndex] = currentSelections;
    updateLiveCardBackground();
    renderQuestion();

    if (currentSelections.length === 2) {
        setTimeout(() => {
            if (currentQuestionIndex < QUESTIONS.length - 1) {
                currentQuestionIndex++;
                renderQuestion();
            } else {
                showScreen('screen-image');
            }
        }, 300);
    }
}

function prevQuestion() {
    if (currentQuestionIndex > 0) {
        currentQuestionIndex--;
        updateLiveCardBackground();
        renderQuestion();
    }
}

function prevScreenFromImage() {

function handleImageUpload(event) {
    const file = event.target.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
            uploadedImageData = e.target.result;
            const preview = document.getElementById('preview-img');
            preview.src = uploadedImageData;
            preview.style.display = 'block';
            document.getElementById('file-label-text').textContent = "画像を変更する";
            document.getElementById('btn-show-result').disabled = false;
            document.getElementById('file-label-box').classList.add('has-image');
        };
        reader.readAsDataURL(file);
    }
}

function calculateScores() {
    const scoreMap = { STYLE: {}, MEDIUM: {}, PURPOSE: {} };
    
    STYLE_ORDER.forEach(k => scoreMap.STYLE[k] = { total: 0, grid1Count: 0, grid2Count: 0 });
    MEDIUM_ORDER.forEach(k => scoreMap.MEDIUM[k] = { total: 0, grid1Count: 0, grid2Count: 0 });
    PURPOSE_ORDER.forEach(k => scoreMap.PURPOSE[k] = { total: 0, grid1Count: 0, grid2Count: 0 });

    userAnswers.forEach((ansData, qIdx) => {
        if (!Array.isArray(ansData)) return;
        const qData = QUESTIONS[qIdx];
        ansData.forEach((selectedKey, idx) => {
            if (scoreMap[qData.category][selectedKey]) {
                const points = (idx === 0) ? 2 : 1;
                scoreMap[qData.category][selectedKey].total += points;
                if (idx === 0) scoreMap[qData.category][selectedKey].grid1Count += 1;
                else scoreMap[qData.category][selectedKey].grid2Count += 1;
            }
        });
    });

    function getRankings(categoryKey, orderList) {
        const catObj = scoreMap[categoryKey];
        const sorted = orderList.map(key => ({
            key,
            total: catObj[key].total,
            grid1: catObj[key].grid1Count,
            grid2: catObj[key].grid2Count
        })).sort((a, b) => {
            if (b.total !== a.total) return b.total - a.total;
            if (b.grid1 !== a.grid1) return b.grid1 - a.grid1;
            return b.grid2 - a.grid2;
        });

        return { rank1: sorted[0], rank2: sorted[1], rank3: sorted[2], all: sorted };
    }

    return {
        style: getRankings('STYLE', STYLE_ORDER),
        medium: getRankings('MEDIUM', MEDIUM_ORDER),
        purpose: getRankings('PURPOSE', PURPOSE_ORDER)
    };
}

function renderAllScoresGraphs(res) {
    const graphSection = document.getElementById('res-all-scores-graph');

    function createCategoryHtml(title, allList, colorMap) {
        let maxVal = Math.max(...allList.map(i => i.total));
        if (maxVal <= 0) maxVal = 1;

        let rowsHtml = '';
        allList.forEach(item => {
            const percentage = Math.round((item.total / maxVal) * 100);
            const barColor = colorMap[item.key] || '#111111';
            rowsHtml += `
                <div class="graph-row">
                    <div class="graph-label">${item.key}</div>
                    <div class="graph-bar-container">
                        <div class="graph-bar-fill" style="width: ${percentage}%; background-color: ${barColor};"></div>
                    </div>
                    <div class="graph-score-text">${item.total}</div>
                </div>
            `;
        });

        return `
            <div class="graph-column">
                <div class="graph-category-title">${title}</div>
                ${rowsHtml}
            </div>
        `;
    }

    graphSection.innerHTML = `
        <div class="graphs-wrapper">
            ${createCategoryHtml('MEDIUM', res.medium.all, COLOR_MEDIUM)}
            ${createCategoryHtml('STYLE', res.style.all, COLOR_STYLE)}
            ${createCategoryHtml('PURPOSE', res.purpose.all, COLOR_PURPOSE)}
        </div>
    `;
}

        link.click();
    });
}
